<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuadanga Agro Firm</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5faf6;
  color:#203126;
}
header{
  background:white;
  padding:12px 5%;
  box-shadow:0 2px 10px #0002;
}
.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  color:#145c32;
}
.logo img{
  width:55px;
  height:55px;
  object-fit:contain;
  border-radius:50%;
}
nav a{
  margin-left:15px;
  text-decoration:none;
  color:#174d2d;
  font-weight:bold;
}
.hero{
  background:linear-gradient(110deg,#0d3420ee,#176b3acc);
  color:white;
  padding:90px 7%;
}
.hero h1{font-size:48px;margin:0 0 10px}
.hero h2{font-size:25px}
.hero p{font-size:19px;max-width:650px;line-height:1.7}
.btn{
  display:inline-block;
  padding:13px 20px;
  margin:8px 8px 0 0;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}
.order{background:#25D366;color:white}
.products{
  max-width:1100px;
  margin:auto;
  padding:60px 18px;
}
.title{text-align:center;margin-bottom:35px}
.title h2{font-size:34px;color:#145c32}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 20px #0001;
  padding-bottom:20px;
}
.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}
.card-content{padding:18px}
.card h3{
  color:#176b3a;
  margin:0 0 8px;
  font-size:22px;
}
.price{
  font-size:20px;
  font-weight:bold;
  margin:12px 0;
}
.about{
  background:#176b3a;
  color:white;
  padding:60px 7%;
  text-align:center;
}
.contact{
  padding:60px 20px;
  text-align:center;
}
.phone{
  font-size:28px;
  font-weight:bold;
  margin:15px;
}
footer{
  background:#092216;
  color:white;
  text-align:center;
  padding:20px;
}
@media(max-width:750px){
  .grid{grid-template-columns:1fr 1fr}
  nav{display:none}
  .hero h1{font-size:38px}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

